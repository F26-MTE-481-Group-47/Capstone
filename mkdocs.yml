site_name: Group 47 - Mechatronics Engineering Capstone
site_description: Group 47 - Mechatronics Engineering Capstone
site_url: https://f26-mte-481-group-47.github.io/Capstone/

repo_name: GitHub Repository
repo_url: https://github.com/F26-MTE-481-Group-47/Capstone

theme:
    name: material
    language: en

    palette:
        - scheme: default
          primary: black
          accent: black
          toggle:
              icon: material/toggle-switch-off-outline
              name: Switch to dark mode

        - scheme: slate
          primary: black
          accent: black
          toggle:
              icon: material/toggle-switch
              name: Switch to light mode

    favicon: images/favicon.svg
    logo: images/logo.svg

    features:
        - navigation.indexes
        - navigation.tabs
        - navigation.top
        - search.suggest
        - content.code.copy

plugins:
    - blog:
          authors_profiles: true
          categories_allowed:
              - General
              - Planning
              - Mechanical
              - Electrical
              - Hardware
              - Software
              - Controls
    - rss:
          match_path: "blog/posts/.*"
          date_from_meta:
              as_creation: date.created
              as_update: date.updated
    - search
    - tags

markdown_extensions:
    - attr_list
    - md_in_html
    - pymdownx.emoji:
          emoji_index: !!python/name:material.extensions.emoji.twemoji
          emoji_generator: !!python/name:material.extensions.emoji.to_svg

hooks:
    - hooks/members.py

extra_css:
    - stylesheets/members.css

nav:
    - Home: index.md
    - Design Log:
          - blog/index.md
    - Members: members.md

extra:
    social:
        - icon: material/rss
          link: /Capstone/feed_rss_created.xml
          name: Subscribe to our RSS feed
site_name: MTE 481 Capstone
site_description: MTE 481 Capstone Project

repo_name: GitHub Repository
repo_url: https://github.com/F26-MTE-481-Group-47/Capstone

theme:
    name: material
    features:
        - navigation.indexes
        - navigation.tabs
        - navigation.top
        - search.suggest
        - content.code.copy

plugins:
    - blog:
        authors_profiles: true
        categories_allowed:
            - General
    - search
    - tags

nav:
    - Home: index.md
    - Design Log: 
        - blog/index.md
    - Members: members.md